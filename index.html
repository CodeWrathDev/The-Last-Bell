<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <title>ကျောင်းည — The Haunted School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05070f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #rotate { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 10; padding: 10px 44px 10px 14px;
        background: rgba(20,26,46,.92); color: #cfd8ff; font: 700 14px/1.3 system-ui, sans-serif; text-align: center; }
      #rotate b { position: absolute; right: 0; top: 0; padding: 10px 16px; font-size: 18px; cursor: pointer; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate.on { display: block; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" class="on">📱 Rotate your phone sideways for the best view <b onclick="this.parentNode.remove()">&times;</b></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
