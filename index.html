<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ကျောင်းည — The Haunted School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05070f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game { position: fixed; inset: 0; overflow: hidden; background: #000; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      /* Phones held upright: a full-screen "turn your phone" screen (the game is paused under it). Tap it to go fullscreen + landscape. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #05070f; color: #cfd8ff; font: 700 17px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; }
      #rotate .ph { font-size: 54px; display: inline-block; animation: turn 2.2s ease-in-out infinite; }
      #rotate small { font-weight: 400; font-size: 13px; color: #8fa0cf; }
      @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><span class="ph">📱</span><span>Turn your phone sideways</span><small>Tap here for fullscreen. If it does not turn by itself, switch off your phone's rotation lock.</small></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
